name: Native framework
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libpng-dev libfreetype-dev libglew-dev libgl1-mesa-dev libwebp-dev \
            nlohmann-json3-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            python3-pil python3-pycryptodome fontconfig fonts-noto-cjk xvfb xauth openbox x11-utils libxtst6
      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ctest --preset dev
      - name: Software OpenGL framebuffer checks (synthetic assets only)
        run: xvfb-run -a -s '-screen 0 1600x1200x24' python3 tests/render_smoke.py
      - name: Script interaction through real keyboard events
        run: xvfb-run -a -s '-screen 0 1600x1200x24' python3 tests/script_window_smoke.py
